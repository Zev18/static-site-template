<!-- This is the HTML document. This describes every element that's visible on your website! -->
<!-- If you want to add something to your website, it has to go in here. -->
<!-- You can create more HTML files to add more pages! -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Nothing in <head> is visible on your actual website! This is all just metadata.  -->

    <!-- Boilerplate stuff, ok to ignore -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This tells the webpage where the stylesheet is! -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- This adds a script -->
    <script src="js/showGallery.js" defer></script>

    <!-- This is where the title of your website goes! -->
    <title>My Website</title>
</head>

<body>
    <!-- Everything that people will see should go inside the <body>! -->
    <div class="main">
        <h1>Hello world!!</h1>
    </div>
</body>

</html>
